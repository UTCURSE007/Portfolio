<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio — editor</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { margin: 0; background: var(--color-bg); color: var(--color-text); }
  * { box-sizing: border-box; }
  .bar { position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; gap: var(--space-3);
    align-items: center; padding: var(--space-3) var(--space-6); background: var(--color-bg);
    border-bottom: 1px solid var(--color-divider); }
  .bar h1 { font-size: 17px; margin: 0; font-weight: 400; letter-spacing: .12em; text-transform: uppercase; }
  .bar .spacer { flex: 1 1 auto; }
  .layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: var(--space-6);
    max-width: 1200px; margin: 0 auto; padding: var(--space-6); align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: minmax(0,1fr); } aside { position: static !important; } }
  aside { position: sticky; top: 70px; display: grid; gap: 2px; }
  aside button { text-align: left; font-family: var(--font-body); font-size: 13px; padding: 7px 10px;
    background: transparent; border: 1px solid transparent; border-radius: var(--radius-md); cursor: pointer; color: var(--color-text); }
  aside button:hover { background: var(--color-accent-100); }
  aside button[aria-current="true"] { border-color: var(--color-accent); color: var(--color-accent-700); }
  .panel h2 { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; margin: 0 0 var(--space-4); }
  .fld { display: grid; gap: 4px; margin-bottom: var(--space-3); }
  .fld > label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-neutral-700); }
  .fld input[type=text], .fld textarea { width: 100%; font-family: var(--font-body); font-size: 14px; color: var(--color-text);
    background: var(--color-neutral-100); border: 1px solid var(--color-neutral-300); border-radius: var(--radius-md); padding: 8px 10px; }
  .fld textarea { line-height: 1.6; resize: vertical; }
  .fld input:focus-visible, .fld textarea:focus-visible, select:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
  .item { border: 1px solid var(--color-neutral-300); border-radius: var(--radius-md); padding: var(--space-3);
    margin-bottom: var(--space-3); background: color-mix(in srgb, var(--color-neutral-100) 60%, transparent); }
  .itemhead { display: flex; align-items: center; gap: 6px; margin-bottom: var(--space-2); }
  .itemhead .n { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-neutral-600); flex: 1 1 auto; }
  .mini { white-space: nowrap; font-family: var(--font-body); font-size: 12px; padding: 3px 8px; cursor: pointer; background: transparent;
    border: 1px solid var(--color-neutral-400); border-radius: var(--radius-md); color: var(--color-text); }
  .mini:hover { border-color: var(--color-accent); color: var(--color-accent-700); }
  .thumb { width: 88px; height: 66px; object-fit: cover; border: 1px solid var(--color-neutral-300); background: var(--color-neutral-200); }
  .imgrow { display: flex; gap: var(--space-3); align-items: flex-start; }
  .imgrow > div { flex: 1 1 auto; min-width: 0; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 6px; }
  .note { font-size: 13px; line-height: 1.6; color: var(--color-neutral-700); margin: 0 0 var(--space-4); max-width: 46em; }
  select { font-family: var(--font-body); font-size: 13px; padding: 6px 8px; background: var(--color-neutral-100);
    border: 1px solid var(--color-neutral-300); border-radius: var(--radius-md); color: var(--color-text); }
  #status { font-size: 12px; color: var(--color-neutral-700); }
  dialog::backdrop { background: rgba(32,31,29,.6); }
  dialog { border: 1px solid var(--color-neutral-300); background: var(--color-bg); color: var(--color-text);
    border-radius: var(--radius-md); padding: var(--space-6); max-width: 620px; box-shadow: var(--shadow-lg); }
</style>
</head>
<body>
<div class="bar">
  <h1>Portfolio editor</h1>
  <span id="status"></span>
  <span class="spacer"></span>
  <button class="btn btn-secondary mini" id="btn-load" style="height:auto">Load JSON…</button>
  <button class="btn btn-secondary mini" id="btn-preview" style="height:auto">Preview</button>
  <button class="btn btn-secondary mini" id="btn-json" style="height:auto">content.json only</button>
  <button class="btn btn-primary mini" id="btn-zip" style="height:auto">Export files to push</button>
  <button class="btn btn-secondary mini" id="btn-reset" style="height:auto">Discard draft</button>
</div>

<div class="layout">
  <aside id="tabs"></aside>
  <div class="panel" id="panel"></div>
</div>

<dialog id="dlg"><div id="dlgbody"></div><div style="margin-top:var(--space-4);text-align:right"><button class="btn btn-secondary mini" style="height:auto" onclick="document.getElementById('dlg').close()">Close</button></div></dialog>
<input type="file" id="jsonpick" accept="application/json" hidden>

<script>
const LS = "utkarsh-portfolio-draft";
let C = null;                  // content
const NEW = {};                // "assets/foo.jpg" -> dataURL for images added in this session
let section = 0;

/* ---------- schema: everything here becomes an editable field ---------- */
const T = (k, label, t) => ({ k, label, t: t || "text" });
const IMG = (k, label) => ({ k, label, t: "image" });

const SCHEMA = [
  { title: "Site & contact", path: "site", fields: [
    T("brand", "Brand (nav)"), T("kicker", "Kicker line"), T("name", "Name"),
    T("tagline", "Tagline", "area"), T("email", "Email"), T("linkedin", "LinkedIn URL"),
    T("linkedinLabel", "LinkedIn label"), T("researchgate", "ResearchGate URL"),
    T("phone", "Phone"), T("location", "Location"), T("resume", "CV file path"),
    IMG("portrait", "Portrait"), { k: "showPortrait", label: "Show portrait", t: "bool" },
    IMG("texture", "Gallery paper texture")
  ] },
  { title: "Visible tabs", path: "tabs", fields: [
    { k: "about", label: "About", t: "bool" }, { k: "research", label: "Research", t: "bool" },
    { k: "photographs", label: "Photographs", t: "bool" }, { k: "paintings", label: "Paintings", t: "bool" },
    { k: "writings", label: "Writings", t: "bool" }, { k: "cv", label: "Curriculum Vitae", t: "bool" }
  ] },
  { title: "Figures band", path: "", fields: [
    { k: "figures", label: "Figures", t: "list", item: [T("value", "Number"), T("label", "Label")] }
  ] },
  { title: "About", path: "about", fields: [
    T("heading", "Heading"), { k: "paragraphs", label: "Paragraphs", t: "strings" }
  ] },
  { title: "Domains & field photos", path: "", fields: [
    { k: "domains", label: "Major domains", t: "list", item: [T("title", "Title"), T("body", "Body", "area")] },
    { k: "field", label: "In the field", t: "list", item: [IMG("src", "Photo"), T("caption", "Caption", "area")] }
  ] },
  { title: "Experience", path: "", fields: [
    { k: "experience", label: "Roles", t: "list", item: [
      T("date", "Dates"), T("title", "Role"), T("org", "Organisation"),
      T("body", "Paragraph", "area"), { k: "bullets", label: "Bullets", t: "strings" }
    ] }
  ] },
  { title: "Publications", path: "publications", fields: [
    T("intro", "Intro", "area"),
    { k: "items", label: "Papers", t: "list", item: [
      T("date", "Date / status"), T("title", "Title", "area"), T("authors", "Authors"), T("venue", "Venue"),
      { k: "figures", label: "Figures", t: "list", item: [
        IMG("src", "Figure"), T("caption", "Caption", "area"),
        { k: "fit", label: "Fit", t: "select", options: ["natural", "cover", "contain", "rotated"] }
      ] }
    ] }
  ] },
  { title: "Photographs", path: "photographs", fields: [
    T("intro", "Intro", "area"),
    { k: "items", label: "Photographs", t: "list", item: [IMG("src", "Photo"), T("caption", "Caption", "area")] }
  ] },
  { title: "Paintings", path: "paintings", fields: [
    T("intro", "Intro", "area"),
    { k: "items", label: "Paintings", t: "list", item: [IMG("src", "Painting"), T("caption", "Caption", "area")] }
  ] },
  { title: "Writings & blog", path: "writings", fields: [
    T("intro", "Intro", "area"),
    { k: "items", label: "Poems & articles", t: "list", item: [
      T("title", "Title"),
      { k: "kind", label: "Kind", t: "select", options: ["poem", "article"] },
      T("date", "Date (optional)"), T("note", "Kicker override (e.g. In Hindi)"),
      { k: "script", label: "Script", t: "select", options: ["latin", "devanagari"] },
      IMG("cover", "Cover image"), T("coverCaption", "Cover caption"),
      T("body", "Text — line breaks are kept; the site shows a preview with a “Read in full” button", "poem")
    ] }
  ] },
  { title: "CV (hidden tab)", path: "cv", fields: [
    { k: "education", label: "Education", t: "list", item: [T("date", "Years"), T("title", "Qualification"), T("meta", "Institution & detail", "area")] },
    { k: "skills", label: "Skills", t: "list", item: [T("label", "Group"), T("value", "Items", "area")] },
    { k: "honours", label: "Honours", t: "list", item: [T("title", "Title"), T("meta", "Detail", "area")] },
    { k: "projects", label: "Projects & leadership", t: "list", item: [T("title", "Title"), T("meta", "Detail", "area"), IMG("src", "Image"), T("caption", "Image caption")] },
    { k: "certificates", label: "Certificates", t: "list", item: [T("title", "Title"), T("meta", "Detail"), IMG("src", "Scan")] }
  ] }
];

/* ---------- plumbing ---------- */
const setVal = (el, v) => { v = v == null ? "" : String(v); el.value = v; if (el.tagName === "TEXTAREA") el.textContent = v; else el.setAttribute("value", v); };
const at = (path) => path ? path.split(".").reduce((o, k) => o[k], C) : C;
const slug = (s) => s.toLowerCase().replace(/\.[a-z0-9]+$/i, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 48);
const ext = (s) => (s.match(/\.[a-z0-9]+$/i) || [".jpg"])[0].toLowerCase();
const save = () => { localStorage.setItem(LS, JSON.stringify({ content: C, newFiles: NEW })); flash("Draft saved locally"); };
let flashT;
function flash(msg) { const s = document.getElementById("status"); s.textContent = msg; clearTimeout(flashT); flashT = setTimeout(() => (s.textContent = ""), 2200); }

function blank(item) {
  const o = {};
  item.forEach((f) => { o[f.k] = f.t === "list" ? [] : f.t === "strings" ? [] : f.t === "bool" ? false : f.t === "select" ? f.options[0] : ""; });
  return o;
}

/* ---------- rendering ---------- */
function renderTabs() {
  document.getElementById("tabs").innerHTML = SCHEMA.map((s, i) =>
    '<button data-i="' + i + '"' + (i === section ? ' aria-current="true"' : "") + ">" + s.title + "</button>").join("");
  document.querySelectorAll("aside button").forEach((b) => b.onclick = () => { section = +b.dataset.i; renderTabs(); renderPanel(); scrollTo(0, 0); });
}

function renderPanel() {
  const s = SCHEMA[section];
  const host = document.getElementById("panel");
  host.innerHTML = "<h2>" + s.title + "</h2>";
  if (s.path === "cv") host.insertAdjacentHTML("beforeend", '<p class="note">The CV tab is hidden on the live site right now. Turn it back on under <strong>Visible tabs</strong> — the content below stays here either way.</p>');
  const obj = at(s.path);
  s.fields.forEach((f) => host.appendChild(fieldNode(obj, f)));
}

function fieldNode(obj, f) {
  if (f.t === "list") return listNode(obj, f);
  if (f.t === "strings") return stringsNode(obj, f);
  const wrap = document.createElement("div");
  wrap.className = "fld";
  const id = "f" + Math.random().toString(36).slice(2);
  if (f.t === "bool") {
    wrap.innerHTML = '<div class="toggle"><input type="checkbox" id="' + id + '"><label for="' + id + '" style="text-transform:none;letter-spacing:0;font-size:14px;color:var(--color-text)">' + f.label + "</label></div>";
    const cb = wrap.querySelector("input");
    cb.checked = !!obj[f.k];
    cb.onchange = () => { obj[f.k] = cb.checked; save(); };
    return wrap;
  }
  if (f.t === "select") {
    wrap.innerHTML = "<label>" + f.label + '</label><select>' + f.options.map((o) => '<option value="' + o + '">' + o + "</option>").join("") + "</select>";
    const sel = wrap.querySelector("select");
    sel.value = obj[f.k] || f.options[0];
    [...sel.options].forEach((o) => { if (o.value === sel.value) o.setAttribute("selected", ""); });
    sel.onchange = () => { obj[f.k] = sel.value; save(); };
    return wrap;
  }
  if (f.t === "image") {
    wrap.innerHTML = "<label>" + f.label + '</label><div class="imgrow"><img class="thumb" alt=""><div>' +
      '<input type="text" style="margin-bottom:6px"><button class="mini">Replace image…</button><input type="file" accept="image/*" hidden></div></div>';
    const [img, text, btn, file] = [wrap.querySelector("img"), wrap.querySelector('input[type=text]'), wrap.querySelector("button"), wrap.querySelector('input[type=file]')];
    const paint = () => { img.src = NEW[obj[f.k]] || obj[f.k] || ""; setVal(text, obj[f.k]); };
    paint();
    text.oninput = () => { obj[f.k] = text.value; save(); };
    btn.onclick = () => file.click();
    file.onchange = () => ingest(file.files[0]).then((p) => { obj[f.k] = p; paint(); save(); });
    return wrap;
  }
  const rows = f.t === "poem" ? 16 : f.t === "area" ? 3 : 0;
  wrap.innerHTML = "<label>" + f.label + "</label>" + (rows ? '<textarea rows="' + rows + '"></textarea>' : '<input type="text">');
  const inp = wrap.querySelector("textarea,input");
  setVal(inp, obj[f.k]);
  inp.oninput = () => { obj[f.k] = inp.value; save(); };
  return wrap;
}

function stringsNode(obj, f) {
  const wrap = document.createElement("div");
  wrap.className = "fld";
  if (!Array.isArray(obj[f.k])) obj[f.k] = [];
  wrap.innerHTML = "<label>" + f.label + " — one per line</label><textarea rows=\"" + Math.max(3, obj[f.k].length + 1) + "\"></textarea>";
  const ta = wrap.querySelector("textarea");
  setVal(ta, obj[f.k].join("\n\n"));
  ta.oninput = () => { obj[f.k] = ta.value.split(/\n{2,}/).map((s) => s.trim()).filter(Boolean); save(); };
  wrap.insertAdjacentHTML("beforeend", '<span style="font-size:11px;color:var(--color-neutral-600)">Separate entries with a blank line.</span>');
  return wrap;
}

function listNode(obj, f) {
  const wrap = document.createElement("div");
  wrap.style.marginBottom = "var(--space-6)";
  if (!Array.isArray(obj[f.k])) obj[f.k] = [];
  const imgKey = (f.item.find((x) => x.t === "image") || {}).k;
  const head = document.createElement("div");
  head.className = "itemhead";
  head.innerHTML = '<span class="n" style="font-size:13px;letter-spacing:.1em;color:var(--color-text)">' + f.label + " (" + obj[f.k].length + ")</span>" +
    (imgKey ? '<button class="mini" data-a="up">Add images…</button><input type="file" accept="image/*" multiple hidden>' : "") +
    '<button class="mini" data-a="add">Add entry</button>';
  wrap.appendChild(head);
  const redraw = () => { const p = wrap.parentNode, n = listNode(obj, f); p.replaceChild(n, wrap); };
  head.querySelector('[data-a=add]').onclick = () => { obj[f.k].push(blank(f.item)); save(); redraw(); };
  if (imgKey) {
    const fi = head.querySelector("input");
    head.querySelector('[data-a=up]').onclick = () => fi.click();
    fi.onchange = async () => {
      for (const file of fi.files) { const p = await ingest(file); const it = blank(f.item); it[imgKey] = p; it.caption = titleize(file.name); obj[f.k].push(it); }
      save(); redraw();
    };
  }
  obj[f.k].forEach((it, i) => {
    const card = document.createElement("div");
    card.className = "item";
    const bar = document.createElement("div");
    bar.className = "itemhead";
    bar.innerHTML = '<span class="n">' + (i + 1) + ". " + (it.title || it.caption || it.label || it.value || it.date || "entry").toString().slice(0, 56) + "</span>" +
      '<button class="mini" data-m="-1" title="Move up">↑</button><button class="mini" data-m="1" title="Move down">↓</button><button class="mini" data-m="x" title="Delete">✕</button>';
    bar.querySelectorAll("[data-m]").forEach((b) => b.onclick = () => {
      const m = b.dataset.m, a = obj[f.k];
      if (m === "x") { if (confirm("Delete this entry?")) a.splice(i, 1); }
      else { const j = i + +m; if (j >= 0 && j < a.length) { const t = a[i]; a[i] = a[j]; a[j] = t; } }
      save(); redraw();
    });
    card.appendChild(bar);
    f.item.forEach((sub) => card.appendChild(fieldNode(it, sub)));
    wrap.appendChild(card);
  });
  return wrap;
}

const titleize = (n) => n.replace(/\.[a-z0-9]+$/i, "").replace(/[-_]+/g, " ").replace(/\s+/g, " ").trim();

function ingest(file) {
  return new Promise((res) => {
    const r = new FileReader();
    r.onload = () => {
      let name = slug(file.name) + ext(file.name);
      let path = "assets/" + name, n = 2;
      while (NEW[path]) path = "assets/" + slug(file.name) + "-" + n++ + ext(file.name);
      NEW[path] = r.result;
      res(path);
    };
    r.readAsDataURL(file);
  });
}

/* ---------- preview ---------- */
function preview() {
  const clone = JSON.parse(JSON.stringify(C));
  const swap = (o) => { for (const k in o) { const v = o[k]; if (typeof v === "string" && NEW[v]) o[k] = NEW[v]; else if (v && typeof v === "object") swap(v); } };
  swap(clone);
  const w = open("index.html", "portfolio-preview");
  const push = () => { try { w.__CONTENT__ = clone; if (w.boot) w.boot(clone); } catch (e) {} };
  setTimeout(push, 400); setTimeout(push, 1200); setTimeout(push, 2500);
}

/* ---------- zip (store, no compression) ---------- */
const CRC = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = -1; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ -1) >>> 0; }
function zip(files) {
  const enc = new TextEncoder(), chunks = [], central = []; let off = 0;
  const u16 = (n) => [n & 255, (n >> 8) & 255], u32 = (n) => [n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >>> 24) & 255];
  files.forEach(({ name, data }) => {
    const nb = enc.encode(name), c = crc32(data);
    const local = new Uint8Array([...u32(0x04034b50), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0), ...u32(c), ...u32(data.length), ...u32(data.length), ...u16(nb.length), ...u16(0)]);
    chunks.push(local, nb, data);
    central.push(new Uint8Array([...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0), ...u32(c), ...u32(data.length), ...u32(data.length), ...u16(nb.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off)]), nb);
    off += local.length + nb.length + data.length;
  });
  let cs = 0; central.forEach((c) => cs += c.length);
  const end = new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(cs), ...u32(off), ...u16(0)]);
  return new Blob([...chunks, ...central, end], { type: "application/zip" });
}
const dataUrlBytes = (d) => { const b = atob(d.split(",")[1]); const a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; };
function download(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }

async function exportZip() {
  const enc = new TextEncoder();
  const files = [{ name: "content.json", data: enc.encode(JSON.stringify(C, null, 2)) }];
  Object.keys(NEW).forEach((p) => files.push({ name: p, data: dataUrlBytes(NEW[p]) }));
  download(zip(files), "portfolio-update.zip");
  const list = ["content.json", ...Object.keys(NEW)];
  document.getElementById("dlgbody").innerHTML =
    "<h3 style=\"margin:0 0 var(--space-3);font-weight:400\">Ready to push</h3>" +
    '<p class="note">Unzip into the repository root, overwriting when asked, then commit. Files in this export:</p>' +
    '<ul style="font-size:13px;line-height:1.7;margin:0;padding-left:1.1em">' + list.map((f) => "<li><code>" + f + "</code></li>").join("") + "</ul>" +
    '<p class="note" style="margin-top:var(--space-4)">Everything else — <code>index.html</code>, <code>styles.css</code>, existing images — is unchanged, so it does not need re-uploading.</p>';
  document.getElementById("dlg").showModal();
}

/* ---------- boot ---------- */
document.getElementById("btn-zip").onclick = exportZip;
document.getElementById("btn-json").onclick = () => download(new Blob([JSON.stringify(C, null, 2)], { type: "application/json" }), "content.json");
document.getElementById("btn-preview").onclick = preview;
document.getElementById("btn-reset").onclick = () => { if (confirm("Discard your local draft and reload content.json from the site?")) { localStorage.removeItem(LS); location.reload(); } };
document.getElementById("btn-load").onclick = () => document.getElementById("jsonpick").click();
document.getElementById("jsonpick").onchange = (ev) => {
  const r = new FileReader();
  r.onload = () => { try { start(JSON.parse(r.result)); save(); flash("Loaded — all sections are in the left-hand list"); } catch (e) { alert("That file is not valid JSON."); } };
  r.readAsText(ev.target.files[0]);
};

function start(data) {
  C = data;
  ["site", "tabs", "about", "publications", "photographs", "paintings", "writings", "cv"].forEach((k) => { if (!C[k]) C[k] = {}; });
  if (!C.writings.items) C.writings.items = [];
  renderTabs(); renderPanel();
}

const draft = localStorage.getItem(LS);
if (draft) {
  try { const d = JSON.parse(draft); Object.assign(NEW, d.newFiles || {}); start(d.content); flash("Restored your unsaved draft"); }
  catch (e) { localStorage.removeItem(LS); location.reload(); }
} else {
  fetch("content.json", { cache: "no-store" }).then((r) => r.json()).then(start).catch(() => {
    renderTabs();
    document.getElementById("panel").innerHTML = '<p class="note">Could not read <code>content.json</code>. Serve this folder over http (GitHub Pages, or <code>python -m http.server</code> in the repo folder) — or use <strong>Load JSON…</strong> above to open the file from disk.</p>';
  });
}
